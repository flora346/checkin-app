name: Build APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'

      - run: flutter create temp_app
      - run: rm -rf temp_app/lib
      - run: cp -r lib temp_app/
      - run: cp pubspec.yaml temp_app/
      - run: cp README.md temp_app/

      - working-directory: temp_app
        run: flutter pub get
      - working-directory: temp_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: checkin-apk
          path: temp_app/build/app/outputs/flutter-apk/app-release.apk
